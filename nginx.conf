server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Flutter web pakai client-side routing (go_router), semua path
    # yang tidak ditemukan sebagai file jatuhkan ke index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
